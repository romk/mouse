<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Where π hides</title>
<meta name="description" content="Ten small experiments where the number π turns up uninvited.">
<link rel="icon" href="../mouse/favicon.png" sizes="64x64" type="image/png">
<meta name="theme-color" content="#f6e7c8">
<style>
:root{ --bg:#f6e7c8; --bg2:#f0d9a8; --fg:#3a2a1a; --muted:#8a7256; --card:#fff7e6; --card-border:#e6cfa3; --accent:#ff8c42; --accent2:#2f8f9d; --line:#d9c29a; }
@media (prefers-color-scheme: dark){ :root{ --bg:#1f2740; --bg2:#141a2c; --fg:#f0ecdf; --muted:#aab0c4; --card:#2a3350; --card-border:#3b476a; --line:#3b476a; --accent2:#5ec4d3; } }
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 50% 30%,var(--bg) 0%,var(--bg2) 100%);color:var(--fg)}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:2rem;margin:.2em 0 0;letter-spacing:-.02em}
.tag{color:var(--muted);margin:0 0 1.2em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tile{background:var(--card);border:2px solid var(--card-border);border-radius:18px;padding:12px 12px 10px;box-shadow:0 6px 0 rgba(90,64,48,.15);display:flex;flex-direction:column}
.tile h2{font-size:1.05rem;margin:0 0 8px}
.tile h2 small{display:block;color:var(--muted);font-weight:500;font-size:.8rem;margin-top:2px}
canvas{width:100%;height:auto;display:block;border-radius:10px;background:var(--bg);touch-action:manipulation}
.est{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.35rem;margin:8px 0 0;line-height:1.3;min-height:1.7em}
.est .ok{color:var(--accent);font-weight:700}
.est .lbl{color:var(--muted);font-size:.8rem;font-family:system-ui,sans-serif;margin-right:.4em}
.sub{color:var(--muted);font-size:.82rem;margin:2px 0 6px;min-height:1.2em}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:auto}
button,select{font:inherit;font-size:.85rem;color:var(--fg);background:var(--bg);border:1.5px solid var(--card-border);border-radius:10px;padding:5px 10px;cursor:pointer}
button.play{min-width:3.4em}
button:active{transform:translateY(1px)}
input[type=range]{flex:1;min-width:80px;accent-color:var(--accent)}
.ctl label{color:var(--muted);font-size:.8rem;display:flex;align-items:center;gap:6px;flex:1}
.blurb{color:var(--muted);font-size:.82rem;line-height:1.4;margin:8px 0 0}
.foot{color:var(--muted);font-size:.85rem;margin-top:24px}
.foot a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Where π hides</h1>
  <p class="tag">Ten small experiments where π turns up uninvited. Digits in orange are the ones already right.</p>
  <div class="grid" id="grid"></div>
  <p class="foot">Made by Romke Jonker. Part of <a href="/">romke.com</a>.</p>
</div>
<script>
(() => {
const PI_STR = '3.141592653589793';
const W = 320, H = 240, DPR = Math.min(2, window.devicePixelRatio || 1);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let C = {};
function readColors(){ C = { fg: css('--fg'), muted: css('--muted'), accent: css('--accent'), accent2: css('--accent2'), line: css('--line'), bg: css('--bg') }; }
readColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); tiles.forEach(t => { if (t.exp.onTheme) t.exp.onTheme(); paint(t); show(t); }); });

const fmt = (x, d = 6) => (isFinite(x) && x >= 0) ? (Math.floor(x * 10 ** d) / 10 ** d).toFixed(d) : '—';
function digits(x, d = 6){
  const s = fmt(x, d);
  if (s === '—') return '—';
  let k = 0; while (k < s.length && s[k] === PI_STR[k]) k++;
  return `<span class="ok">${s.slice(0, k)}</span>${s.slice(k)}`;
}
const between = (lo, hi) => digits(lo) + '<span class="lbl"> &lt; π &lt; </span>' + digits(hi);
const big = n => n.toLocaleString('en-US');
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function offscreen(w, h, dpr = DPR){ const c = document.createElement('canvas'); c.width = w * dpr; c.height = h * dpr; const x = c.getContext('2d'); x.scale(dpr, dpr); return [c, x]; }
function clear(ctx){ ctx.clearRect(0, 0, W, H); }
function fade(ox, a){ ox.globalCompositeOperation = 'destination-out'; ox.fillStyle = `rgba(0,0,0,${a})`; ox.fillRect(0, 0, W, H); ox.globalCompositeOperation = 'source-over'; }
// A magnifier: shows the main drawing around (px,py) at mag× inside a circle at (cx,cy).
function lens(ctx, cx, cy, r, mag, px, py, drawFn){
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.clip();
  ctx.fillStyle = C.bg; ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  ctx.translate(cx, cy); ctx.scale(mag, mag); ctx.translate(-px, -py);
  drawFn(ctx, mag); ctx.restore();
  ctx.strokeStyle = C.fg; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
  ctx.strokeStyle = C.muted; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.arc(px, py, 6, 0, 7); ctx.stroke();
  const d = Math.hypot(cx - px, cy - py); if (d > r + 8){ ctx.beginPath(); ctx.moveTo(px + 6 * (cx - px) / d, py + 6 * (cy - py) / d); ctx.lineTo(cx - r * (cx - px) / d, cy - r * (cy - py) / d); ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.fillStyle = C.muted; ctx.font = '11px system-ui'; ctx.textAlign = 'center'; ctx.fillText('×' + (mag >= 10 ? Math.round(mag) : mag.toFixed(1)), cx, cy + r + 13);
}
const logSlider = { min: 0, max: 600, toN: v => Math.round(10 ** (v / 100)), fromN: n => Math.round(100 * Math.log10(Math.max(1, n))) };

// ---------- experiments ----------
const EXPS = [];

// 1. Rolling wheel
EXPS.push({
  name: 'Rolling wheel', hint: 'one turn of a wheel of diameter 1',
  blurb: 'A wheel of diameter 1 makes one full turn along a ruler. The distance it rolls is its circumference: π, by definition. Not a discovery, just the starting point.',
  reset(){ this.theta = 0; },
  step(dt){ this.theta = Math.min(2 * Math.PI, this.theta + dt * Math.PI / 2); },
  draw(ctx){
    clear(ctx);
    const scale = (W - 40) / 3.4, R = 0.5 * scale, base = 175, x0 = 20, th = this.theta;
    const d = th * 0.5;
    ctx.strokeStyle = C.line; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x0, base); ctx.lineTo(W - 10, base); ctx.stroke();
    ctx.fillStyle = C.muted; ctx.font = '12px system-ui'; ctx.textAlign = 'center';
    for (let k = 0; k <= 3; k++){ const x = x0 + k * scale; ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x, base + 8); ctx.stroke(); ctx.fillText(k, x, base + 22); }
    const xpi = x0 + Math.PI * scale; ctx.beginPath(); ctx.moveTo(xpi, base); ctx.lineTo(xpi, base + 8); ctx.stroke(); ctx.fillText('π', xpi, base + 22);
    ctx.strokeStyle = C.accent; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x0, base); ctx.lineTo(x0 + d * scale, base); ctx.stroke();
    const cx = x0 + d * scale, cy = base - R;
    ctx.strokeStyle = C.fg; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.stroke();
    // rolling to the right = clockwise on screen; the rim already unrolled runs from the contact point backwards
    ctx.strokeStyle = C.accent; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, R, Math.PI / 2 + th, Math.PI / 2 + 2 * Math.PI); ctx.stroke();
    ctx.strokeStyle = C.fg; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - R * Math.sin(th), cy + R * Math.cos(th)); ctx.stroke();
    ctx.fillStyle = C.fg; ctx.beginPath(); ctx.arc(cx, cy, 3, 0, 7); ctx.fill();
  },
  readout(){ return digits(this.theta * 0.5); },
  sub(){ return `${Math.round(this.theta / (2 * Math.PI) * 360)}° of one turn`; }
});

// 2. Archimedes' polygons
EXPS.push({
  name: "Archimedes' polygons", hint: 'squeezed between two n-gons',
  blurb: 'A regular polygon inside the circle is shorter than the circle; one outside is longer. More sides, tighter squeeze. Archimedes stopped at 96 sides and got 3.1408 < π < 3.1429. The magnifier keeps the gap visible.',
  range: { label: 'sides', min: 3, max: 300, get(){ return this.n; }, set(v){ this.n = v; } },
  reset(){ this.n = 3; this.acc = 0; },
  step(dt){ if (this.n >= 300) return; this.acc += dt; const per = this.n < 12 ? 0.6 : this.n < 40 ? 0.25 : 0.05; if (this.acc > per){ this.acc = 0; this.n++; } },
  geometry(ctx, mag){
    const n = this.n, cx = 118, cy = H / 2, R = 92, Ro = R / Math.cos(Math.PI / n);
    ctx.strokeStyle = C.muted; ctx.lineWidth = 1.5 / mag; ctx.setLineDash([4 / mag, 4 / mag]); ctx.beginPath();
    for (let k = 0; k <= n; k++){ const a = -Math.PI / 2 + Math.PI / n + k * 2 * Math.PI / n; ctx[k ? 'lineTo' : 'moveTo'](cx + Ro * Math.cos(a), cy + Ro * Math.sin(a)); }
    ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = C.fg; ctx.lineWidth = 2 / mag; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
    ctx.strokeStyle = C.accent; ctx.lineWidth = 2.5 / mag; ctx.beginPath();
    for (let k = 0; k <= n; k++){ const a = -Math.PI / 2 + k * 2 * Math.PI / n; ctx[k ? 'lineTo' : 'moveTo'](cx + R * Math.cos(a), cy + R * Math.sin(a)); }
    ctx.stroke();
  },
  draw(ctx){
    clear(ctx); this.geometry(ctx, 1);
    const n = this.n, R = 92, gap = R * (1 / Math.cos(Math.PI / n) - Math.cos(Math.PI / n));
    const mag = clamp(28 / gap, 1, 5000), a = -Math.PI / 5;
    lens(ctx, 262, 182, 46, mag, 118 + R * Math.cos(a), H / 2 + R * Math.sin(a), (c, m) => this.geometry(c, m));
  },
  readout(){ const n = this.n; return between(n * Math.sin(Math.PI / n), n * Math.tan(Math.PI / n)); },
  sub(){ return `${this.n} sides: half the inner and outer perimeter`; }
});

// 3. Quadtree squares
EXPS.push({
  name: 'Squares in a circle', hint: 'ever smaller squares',
  blurb: 'Start with one big square around the unit circle. Keep squares that lie fully inside, throw away those fully outside, and split the ones on the edge into four. The area kept creeps up to π; kept plus edge squares comes down to it.',
  S: 200, X0: 12, MAX: 11,
  range: { label: 'depth', min: 0, max: 11, get(){ return this.depth; }, set(v){ this.build(v); } },
  reset(){ this.build(0); },
  build(d){ this.depth = 0; this.inside = 0; this.ins = []; this.edge = [[-1, -1, 2]]; this.edgeArea = 4; this.acc = 0; [this.oc, this.ox] = offscreen(this.S, this.S); for (let i = 0; i < d; i++) this.split(); },
  classify(x, y, s){
    const dx = Math.max(x, -(x + s), 0), dy = Math.max(y, -(y + s), 0);
    const near = Math.hypot(dx, dy);
    const far = Math.hypot(Math.max(Math.abs(x), Math.abs(x + s)), Math.max(Math.abs(y), Math.abs(y + s)));
    return far <= 1 ? 1 : near >= 1 ? -1 : 0;
  },
  split(){
    const next = []; let area = 0; const k = this.S / 2, ox = this.ox;
    ox.fillStyle = C.accent; ox.strokeStyle = C.bg; ox.lineWidth = 0.5;
    for (const [x, y, s] of this.edge){
      const h = s / 2;
      for (const [a, b] of [[x, y], [x + h, y], [x, y + h], [x + h, y + h]]){
        const c = this.classify(a, b, h);
        if (c === 1){ this.inside += h * h; this.ins.push([a, b, h]); const px = (a + 1) * k, py = (b + 1) * k, ps = h * k; ox.fillRect(px, py, ps, ps); if (ps > 2) ox.strokeRect(px, py, ps, ps); }
        else if (c === 0){ next.push([a, b, h]); area += h * h; }
      }
    }
    this.edge = next; this.edgeArea = area; this.depth++;
  },
  onTheme(){ this.build(this.depth); },
  step(dt){ if (this.depth >= this.MAX) return; this.acc += dt; if (this.acc > (this.depth < 3 ? 1.0 : 0.7)){ this.acc = 0; this.split(); } },
  cells(ctx, mag, ux, uy, ur){ // draw cells near unit-circle point (ux,uy) within radius ur, in main coordinates
    const k = this.S / 2, x0 = this.X0, y0 = (H - this.S) / 2;
    const near = ([x, y, s]) => x < ux + ur && x + s > ux - ur && y < uy + ur && y + s > uy - ur;
    ctx.fillStyle = C.accent; ctx.strokeStyle = C.bg; ctx.lineWidth = 0.5 / mag;
    for (const c of this.ins) if (near(c)){ const [x, y, s] = c; ctx.fillRect(x0 + (x + 1) * k, y0 + (y + 1) * k, s * k, s * k); ctx.strokeRect(x0 + (x + 1) * k, y0 + (y + 1) * k, s * k, s * k); }
    ctx.strokeStyle = C.muted; ctx.lineWidth = 0.7 / mag;
    for (const c of this.edge) if (near(c)){ const [x, y, s] = c; ctx.strokeRect(x0 + (x + 1) * k, y0 + (y + 1) * k, s * k, s * k); }
    ctx.strokeStyle = C.fg; ctx.lineWidth = 1.5 / mag; ctx.beginPath(); ctx.arc(x0 + k, y0 + k, k, 0, 7); ctx.stroke();
  },
  draw(ctx){
    clear(ctx);
    const S = this.S, x0 = this.X0, y0 = (H - S) / 2, k = S / 2;
    ctx.drawImage(this.oc, x0, y0, S, S);
    ctx.strokeStyle = C.muted; ctx.lineWidth = 0.7;
    if (this.edge.length < 6000) for (const [x, y, s] of this.edge) ctx.strokeRect(x0 + (x + 1) * k, y0 + (y + 1) * k, s * k, s * k);
    ctx.strokeStyle = C.fg; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x0 + k, y0 + k, k, 0, 7); ctx.stroke();
    const cell = 2 / 2 ** this.depth * k, mag = clamp(12 / cell, 1, 400), a = -Math.PI / 5, r = 46;
    const ux = Math.cos(a), uy = Math.sin(a);
    lens(ctx, 262, 182, r, mag, x0 + k + ux * k, y0 + k + uy * k, (c, m) => this.cells(c, m, ux, uy, r / m / k * 1.2));
  },
  readout(){ return between(this.inside, this.inside + this.edgeArea); },
  sub(){ return `depth ${this.depth}: ${big(this.edge.length)} squares on the edge`; }
});

// 4. Darts
EXPS.push({
  name: 'Darts', hint: 'random points, circle in a square',
  blurb: 'Throw darts at random into a square with a circle inside. The share that lands in the circle is its area over the square\'s: π/4. Slow and noisy: a hundred times the darts buys you one more digit. Tap to throw 200 more.',
  S: 236,
  reset(){ this.n = 0; this.inside = 0; [this.oc, this.ox] = offscreen(this.S, this.S); },
  throw(k){
    const ox = this.ox, S = this.S;
    for (let i = 0; i < k; i++){
      const x = Math.random() * 2 - 1, y = Math.random() * 2 - 1, inn = x * x + y * y <= 1;
      this.n++; if (inn) this.inside++;
      ox.fillStyle = inn ? C.accent : C.muted; ox.fillRect((x + 1) / 2 * S - 0.75, (y + 1) / 2 * S - 0.75, 1.5, 1.5);
    }
  },
  tap(){ this.throw(200); },
  step(){ this.throw(this.n < 2000 ? 10 : 60); },
  draw(ctx){
    clear(ctx); const S = this.S, x0 = (W - S) / 2, y0 = (H - S) / 2;
    ctx.drawImage(this.oc, x0, y0, S, S);
    ctx.strokeStyle = C.fg; ctx.lineWidth = 1.5; ctx.strokeRect(x0, y0, S, S); ctx.beginPath(); ctx.arc(W / 2, H / 2, S / 2, 0, 7); ctx.stroke();
  },
  readout(){ return digits(4 * this.inside / this.n); },
  sub(){ return `${big(this.n)} darts, ${big(this.inside)} in the circle, × 4`; }
});

// 5. Buffon's needle
EXPS.push({
  name: "Buffon's needle", hint: 'needles on a striped floor',
  blurb: 'Drop needles on a floor with stripes as wide as the needle is long. The chance a needle crosses a line is 2/π (Buffon, 1777). So π ≈ 2 × needles ÷ crossings. Tap the floor to drop one yourself.',
  T: 40,
  reset(){ this.n = 0; this.cross = 0; [this.oc, this.ox] = offscreen(W, H); },
  drop(x, y, a){
    const T = this.T, L = T, h = Math.abs(Math.sin(a)) * L / 2;
    const c = Math.floor((y - h) / T) !== Math.floor((y + h) / T);
    this.n++; if (c) this.cross++;
    const ox = this.ox; ox.strokeStyle = c ? C.accent : C.fg; ox.lineWidth = c ? 2 : 1.2; ox.globalAlpha = c ? 0.9 : 0.55;
    ox.beginPath(); ox.moveTo(x - Math.cos(a) * L / 2, y - h * Math.sign(Math.sin(a))); ox.lineTo(x + Math.cos(a) * L / 2, y + h * Math.sign(Math.sin(a))); ox.stroke(); ox.globalAlpha = 1;
  },
  tap(x, y){ this.drop(x, y, Math.random() * Math.PI); },
  step(){ const k = this.n < 300 ? 1 : this.n < 3000 ? 4 : 20; if (this.n > 400) fade(this.ox, 0.04); for (let i = 0; i < k; i++) this.drop(rnd(0, W), rnd(0, H), Math.random() * Math.PI); },
  draw(ctx){
    clear(ctx);
    ctx.strokeStyle = C.line; ctx.lineWidth = 1.5;
    for (let y = 0; y <= H; y += this.T){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.drawImage(this.oc, 0, 0, W, H);
  },
  readout(){ return digits(2 * this.n / this.cross); },
  sub(){ return `${big(this.n)} needles, ${big(this.cross)} crossing a line`; }
});

// 6. Bouncing blocks (real physical time, elastic collisions solved exactly)
EXPS.push({
  name: 'Bouncing blocks', hint: 'count the clacks',
  blurb: 'A big block slides into a small one, which bounces between it and a wall. Count every clack. With the big block 100ⁿ times heavier, the count is the first n+1 digits of π (Galperin, 1995). Played in real time, slowed down 4×; at big ratios the clacks blur together.',
  select: { label: 'mass ratio', options: [[1, '1 : 1'], [100, '1 : 100'], [1e4, '1 : 10 000'], [1e6, '1 : 1 000 000'], [1e8, '1 : 100 000 000']], get(){ return this.ratio; }, set(v){ this.ratio = +v; this.reset(); } },
  ratio: 100, SPEED: 0.25,
  reset(){
    const M = this.ratio, m = 1; let xs = 0.25, xb = 1.0, vs = 0, vb = -1, t = 0;
    const T = [0], XS = [xs], XB = [xb], VS = [vs], VB = [vb];
    for (let n = 0; n < 1e7; n++){
      let tb = Infinity, tw = Infinity;
      if (vb < vs) tb = (xb - xs) / (vs - vb);
      if (vs < 0) tw = -xs / vs;
      if (tb === Infinity && tw === Infinity) break;
      const d = Math.min(tb, tw); xs += vs * d; xb += vb * d; t += d;
      if (tb <= tw){ const a = ((m - M) * vs + 2 * M * vb) / (m + M), b = ((M - m) * vb + 2 * m * vs) / (m + M); vs = a; vb = b; xb = xs; } else { vs = -vs; xs = 0; }
      T.push(t); XS.push(xs); XB.push(xb); VS.push(vs); VB.push(vb);
    }
    this.T = T; this.XS = XS; this.XB = XB; this.VS = VS; this.VB = VB; this.N = T.length - 1; this.t = 0; this.i = 0; this.end = T[this.N] + 1.2;
  },
  step(dt){ this.t = Math.min(this.end, this.t + dt * this.SPEED); while (this.i < this.N && this.T[this.i + 1] <= this.t) this.i++; },
  draw(ctx){
    clear(ctx);
    const i = this.i, d = this.t - this.T[i], xs = this.XS[i] + this.VS[i] * d, xb = this.XB[i] + this.VB[i] * d;
    const scale = 160, wall = 24, floor = 190, sm = 16, bg = 24 + 6 * Math.log10(this.ratio);
    ctx.fillStyle = C.line; ctx.fillRect(0, floor, W, 3); ctx.fillRect(wall - 4, floor - 120, 4, 123);
    ctx.fillStyle = C.accent; ctx.fillRect(wall + xs * scale, floor - sm, sm, sm);
    ctx.fillStyle = C.fg; ctx.fillRect(wall + sm + xb * scale, floor - bg, bg, bg);
    ctx.fillStyle = C.fg; ctx.font = '700 34px system-ui'; ctx.textAlign = 'left'; ctx.fillText(big(i), 24, 48);
    ctx.fillStyle = C.muted; ctx.font = '12px system-ui'; ctx.fillText('clacks', 26, 66);
  },
  readout(){ const k = Math.sqrt(this.ratio); return digits(this.i / k, Math.round(Math.log10(k))); },
  sub(){ const k = Math.sqrt(this.ratio); return `${big(this.N)} clacks in total ÷ √${big(this.ratio)} = ÷ ${big(k)}`; }
});

// 7. Coprime pairs
EXPS.push({
  name: 'Coprime pairs', hint: 'no circle in sight',
  blurb: 'Colour every pair of whole numbers (a, b) that share no factor. The share of such pairs tends to 6/π² (Cesàro, 1881). No circle anywhere; π sneaks in through the sum 1 + 1/4 + 1/9 + ….',
  S: 236, LEVELS: [25, 50, 100, 200, 400, 800, 1600],
  range: { label: 'size', min: 0, max: 6, get(){ return this.li; }, set(v){ this.li = v; this.auto = false; this.start(); return true; } },
  reset(){ this.li = 0; this.auto = true; this.start(); },
  start(){ const N = this.LEVELS[this.li]; this.N = N; this.row = 1; this.cop = 0; this.cnt = 0; this.oc = document.createElement('canvas'); this.oc.width = N; this.oc.height = N; this.ox = this.oc.getContext('2d'); this.img = this.ox.createImageData(N, 1); this.hold = 0; this.rgb = this.parse(C.accent); this.rgb2 = this.parse(C.bg); },
  parse(col){ const c = document.createElement('canvas').getContext('2d'); c.fillStyle = col; const s = c.fillStyle; return [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)]; },
  onTheme(){ this.start(); },
  gcd(a, b){ while (b){ const t = a % b; a = b; b = t; } return a; },
  step(dt){
    const N = this.N;
    if (this.row > N){ this.hold += dt; if (this.auto && this.hold > 1.2 && this.li < this.LEVELS.length - 1){ this.li++; this.start(); } return; }
    const rows = Math.max(1, Math.ceil(N / 150));
    for (let r = 0; r < rows && this.row <= N; r++, this.row++){
      const a = this.row, d = this.img.data;
      for (let b = 1; b <= N; b++){ const c = this.gcd(a, b) === 1; this.cnt++; if (c) this.cop++; const col = c ? this.rgb : this.rgb2, o = (b - 1) * 4; d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255; }
      this.ox.putImageData(this.img, 0, N - a);
    }
  },
  draw(ctx){
    clear(ctx); const S = this.S, x0 = (W - S) / 2, y0 = (H - S) / 2;
    ctx.imageSmoothingEnabled = this.N > 236; ctx.drawImage(this.oc, x0, y0, S, S); ctx.imageSmoothingEnabled = true;
    ctx.strokeStyle = C.fg; ctx.lineWidth = 1.5; ctx.strokeRect(x0, y0, S, S);
  },
  readout(){ return digits(Math.sqrt(6 * this.cnt / this.cop)); },
  sub(){ return `pairs up to ${big(this.N)}: ${big(this.cop)} of ${big(this.cnt)} coprime, √(6 ÷ share)`; }
});

// 8. Basel stack
EXPS.push({
  name: 'Shrinking squares', hint: '1 + ¼ + ⅑ + …',
  blurb: 'Squares of side 1, ½, ⅓, ¼, … in a row. Their total area is 1 + 1/4 + 1/9 + … = π²/6 (Euler, 1734, the Basel problem). The filled square on the right has that total area; the dashed one is the target. Slow: the gap shrinks like 1/n.',
  range: { label: 'squares', min: logSlider.min, max: logSlider.max, get(){ return logSlider.fromN(this.n); }, set(v){ this.setN(logSlider.toN(v)); } },
  reset(){ this.n = 0; this.sum = 0; this.acc = 0; },
  setN(n){ this.n = 0; this.sum = 0; this.acc = 0; this.add(n); },
  add(k){ for (let i = 0; i < k; i++){ this.n++; this.sum += 1 / (this.n * this.n); } },
  step(dt){ if (this.n >= 1e6) return; if (this.n < 10){ this.acc += dt; if (this.acc > 0.5){ this.acc = 0; this.add(1); } return; } this.add(Math.max(1, Math.ceil(this.n / 150))); },
  draw(ctx){
    clear(ctx);
    const S = 96, base = 200, x0 = 12;
    ctx.fillStyle = C.accent; let x = x0;
    for (let n = 1; n <= this.n; n++){ const s = S / n; if (s < 0.4) break; ctx.globalAlpha = n === 1 ? 1 : 0.85; ctx.fillRect(x, base - s, s, s); x += s + (s > 4 ? 1.5 : 0); }
    ctx.globalAlpha = 1;
    ctx.fillStyle = C.muted; ctx.font = '12px system-ui'; ctx.textAlign = 'left';
    if (this.n >= 1) ctx.fillText('1', x0 + S / 2 - 3, base + 16); if (this.n >= 2) ctx.fillText('½', x0 + S + 1.5 + S / 4 - 4, base + 16); if (this.n >= 3) ctx.fillText('⅓', x0 + S * 1.5 + 3 + S / 6 - 5, base + 16);
    const T = Math.sqrt(Math.PI * Math.PI / 6) * S * 0.85, cx = W - 78, cy = 140, t = Math.sqrt(this.sum) * S * 0.85;
    ctx.strokeStyle = C.muted; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5; ctx.strokeRect(cx - T / 2, cy - T / 2, T, T); ctx.setLineDash([]);
    ctx.fillStyle = C.accent2; ctx.fillRect(cx - t / 2, cy - t / 2, t, t);
    ctx.fillStyle = C.muted; ctx.textAlign = 'center'; ctx.fillText('area π²/6', cx, cy + T / 2 + 16);
  },
  readout(){ return digits(Math.sqrt(6 * this.sum)); },
  sub(){ return `${big(this.n)} squares, area ${this.sum.toFixed(6)}, √(6 × area)`; }
});

// 9. Leibniz zigzag
EXPS.push({
  name: 'Leibniz zigzag', hint: '4 − 4/3 + 4/5 − …',
  blurb: 'Step 4 to the right, 4/3 back, 4/5 forward, 4/7 back, for ever. The path narrows onto π (Leibniz, 1676; Madhava earlier). Beautiful and useless: a million steps for six digits.',
  range: { label: 'terms', min: logSlider.min, max: logSlider.max, get(){ return logSlider.fromN(this.k); }, set(v){ this.setK(logSlider.toN(v)); } },
  reset(){ this.k = 0; this.s = 0; this.pts = []; this.next = 1; this.acc = 0; },
  setK(k){ this.reset(); this.add(k); },
  add(k){ for (let i = 0; i < k; i++){ this.s += 4 * (this.k % 2 ? -1 : 1) / (2 * this.k + 1); this.k++; if (this.k >= this.next){ this.pts.push([this.s, this.k]); this.next = this.k < 40 ? this.k + 1 : Math.ceil(this.next * 1.1); } } },
  step(dt){ if (this.k >= 1e6) return; if (this.k < 8){ this.acc += dt; if (this.acc > 0.4){ this.acc = 0; this.add(1); } return; } this.add(Math.max(1, Math.ceil(this.k / 250))); },
  draw(ctx){
    clear(ctx);
    const xOf = s => 20 + (s - 2) / 2 * (W - 40), yOf = k => 14 + Math.log(Math.max(1, k)) / Math.log(2e6) * (H - 28);
    ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(xOf(2), 10); ctx.lineTo(xOf(2), H - 10); ctx.moveTo(xOf(4), 10); ctx.lineTo(xOf(4), H - 10); ctx.stroke();
    ctx.strokeStyle = C.accent2; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(xOf(Math.PI), 10); ctx.lineTo(xOf(Math.PI), H - 10); ctx.stroke();
    ctx.fillStyle = C.muted; ctx.font = '12px system-ui'; ctx.textAlign = 'center'; ctx.fillText('2', xOf(2), H - 2); ctx.fillText('4', xOf(4), H - 2); ctx.fillText('π', xOf(Math.PI), H - 2);
    if (!this.k) return;
    ctx.strokeStyle = C.accent; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(xOf(4), yOf(1));
    for (const [s, k] of this.pts) ctx.lineTo(xOf(s), yOf(k));
    ctx.lineTo(xOf(this.s), yOf(this.k)); ctx.stroke();
    ctx.fillStyle = C.fg; ctx.beginPath(); ctx.arc(xOf(this.s), yOf(this.k), 3.5, 0, 7); ctx.fill();
  },
  readout(){ return digits(this.s); },
  sub(){ return `${big(this.k)} terms`; }
});

// 10. Mandelbrot neck
EXPS.push({
  name: 'Mandelbrot neck', hint: 'iterate z² + c just off the set',
  blurb: 'Pick c = −0.75 + εi, a hair above the pinch between the two big parts of the Mandelbrot set, and iterate z → z² + c until it escapes. The orbit lingers around −½ (the dots), flipping sides every step and drifting outward, and the number of steps times ε tends to π (Boll, 1991).',
  select: { label: 'ε', options: [[0.01, '0.01'], [0.001, '0.001'], [0.0001, '0.0001'], [0.00001, '0.00001']], get(){ return this.eps; }, set(v){ this.eps = +v; this.reset(); } },
  eps: 0.001, RE0: -2.25, IM0: -1.125, SC: 3 / W, // plane: re in [-2.25, 0.75], im in [-1.125, 1.125]
  reset(){ this.zr = 0; this.zi = 0; this.n = 0; this.gone = false; this.row = 0; [this.oc, this.ox] = offscreen(W, H, 2); [this.od, this.odx] = offscreen(W, H); this.img = this.ox.createImageData(2 * W, 1); this.dark = this.parse(C.fg); this.light = this.parse(C.bg); },
  parse(col){ const c = document.createElement('canvas').getContext('2d'); c.fillStyle = col; const s = c.fillStyle; return [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)]; },
  onTheme(){ const st = [this.zr, this.zi, this.n, this.gone]; this.reset(); [this.zr, this.zi, this.n, this.gone] = st; },
  render(rows){
    const w = 2 * W, h = 2 * H, d = this.img.data, [dr, dg, db] = this.dark, [lr, lg, lb] = this.light;
    for (let r = 0; r < rows && this.row < h; r++, this.row++){
      const ci = this.IM0 + this.row / h * 2.25;
      for (let i = 0; i < w; i++){
        const cr = this.RE0 + i / w * 3; let zr = 0, zi = 0, n = 0;
        while (zr * zr + zi * zi <= 4 && n < 80){ const t = zr * zr - zi * zi + cr; zi = 2 * zr * zi + ci; zr = t; n++; }
        const o = i * 4, f = n >= 80 ? 1 : Math.min(1, n / 80) * 0.55;
        d[o] = lr + (dr - lr) * f; d[o + 1] = lg + (dg - lg) * f; d[o + 2] = lb + (db - lb) * f; d[o + 3] = 255;
      }
      this.ox.putImageData(this.img, 0, this.row);
    }
  },
  px(re, im){ return [(re - this.RE0) / this.SC, (im - this.IM0) / this.SC]; },
  step(){
    if (this.row < 2 * H){ this.render(24); return; }
    if (this.gone) return;
    const k = Math.max(1, Math.round(Math.PI / this.eps / 300)), cr = -0.75, ci = this.eps, od = this.odx;
    fade(od, 0.03); od.fillStyle = C.accent;
    for (let i = 0; i < k; i++){
      if (this.zr * this.zr + this.zi * this.zi > 4){ this.gone = true; break; }
      const t = this.zr * this.zr - this.zi * this.zi + cr; this.zi = 2 * this.zr * this.zi + ci; this.zr = t; this.n++;
      const [x, y] = this.px(this.zr, this.zi); od.fillRect(x - 1, y - 1, 2, 2);
    }
  },
  draw(ctx){
    clear(ctx);
    ctx.drawImage(this.oc, 0, 0, W, H);
    ctx.drawImage(this.od, 0, 0, W, H);
    const [cx, cy] = this.px(-0.75, 0);
    ctx.strokeStyle = C.accent2; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx - 7, cy); ctx.lineTo(cx + 7, cy); ctx.moveTo(cx, cy - 7); ctx.lineTo(cx, cy + 7); ctx.stroke();
    ctx.fillStyle = C.accent2; ctx.font = '12px system-ui'; ctx.textAlign = 'left'; ctx.fillText('c', cx + 9, cy - 5);
    if (!this.gone){ const [x, y] = this.px(this.zr, this.zi); ctx.fillStyle = C.accent; ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill(); ctx.strokeStyle = C.bg; ctx.lineWidth = 1; ctx.stroke(); }
    ctx.fillStyle = C.fg; ctx.font = '700 26px system-ui'; ctx.textAlign = 'right'; ctx.fillText(big(this.n), W - 10, 34);
    ctx.fillStyle = C.muted; ctx.font = '12px system-ui'; ctx.fillText(this.gone ? 'steps, escaped' : 'steps', W - 10, 50);
  },
  readout(){ return digits(this.n * this.eps, Math.round(-Math.log10(this.eps))); },
  sub(){ return `${big(this.n)} steps × ${this.eps}${this.gone ? ', escaped' : ''}`; }
});

// ---------- framework ----------
const grid = document.getElementById('grid');
const PLAY = '▶', PAUSE = '❚❚';
function show(t){ t.est.innerHTML = t.exp.readout(); t.sub.textContent = t.exp.sub(); if (t.sync) t.sync(); }
function paint(t){
  t.exp.draw(t.ctx);
  if (t.running) return;
  const ctx = t.ctx, label = t.fresh ? 'tap to animate' : 'paused: tap to continue', w = 150;
  ctx.fillStyle = C.fg; ctx.globalAlpha = 0.78; ctx.beginPath(); ctx.roundRect(W / 2 - w / 2, H / 2 - 16, w, 32, 16); ctx.fill(); ctx.globalAlpha = 1;
  ctx.fillStyle = C.bg; ctx.font = '600 13px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, W / 2, H / 2); ctx.textBaseline = 'alphabetic';
}
function setRunning(t, r){ t.running = r; t.play.textContent = r ? PAUSE : PLAY; if (r) t.fresh = false; paint(t); }
const tiles = EXPS.map(exp => {
  const el = document.createElement('section'); el.className = 'tile';
  el.innerHTML = `<h2>${exp.name} <small>${exp.hint}</small></h2><canvas width="${W * DPR}" height="${H * DPR}"></canvas><div class="est"></div><div class="sub"></div><div class="ctl"><button class="play">▶</button><button class="rst" title="Clear">clear</button></div><p class="blurb">${exp.blurb}</p>`;
  grid.appendChild(el);
  const cv = el.querySelector('canvas'), ctx = cv.getContext('2d'); ctx.scale(DPR, DPR);
  const t = { exp, el, ctx, est: el.querySelector('.est'), sub: el.querySelector('.sub'), play: el.querySelector('.play'), running: false, fresh: true, visible: false };
  const ctl = el.querySelector('.ctl'), syncs = [];
  if (exp.select){
    const sel = document.createElement('select');
    for (const [v, l] of exp.select.options){ const o = document.createElement('option'); o.value = v; o.textContent = l; sel.appendChild(o); }
    const lab = document.createElement('label'); lab.textContent = exp.select.label; lab.appendChild(sel); ctl.appendChild(lab);
    sel.addEventListener('change', () => { exp.select.set.call(exp, sel.value); setRunning(t, true); show(t); });
    syncs.push(() => { sel.value = exp.select.get.call(exp); });
  }
  if (exp.range){
    const r = document.createElement('input'); r.type = 'range'; r.min = exp.range.min; r.max = exp.range.max;
    const lab = document.createElement('label'); lab.textContent = exp.range.label; lab.appendChild(r); ctl.appendChild(lab);
    r.addEventListener('input', () => { const keep = exp.range.set.call(exp, +r.value); t.fresh = false; setRunning(t, keep === true); show(t); });
    syncs.push(() => { r.value = exp.range.get.call(exp); });
  }
  t.sync = () => syncs.forEach(f => f());
  t.play.addEventListener('click', () => setRunning(t, !t.running));
  el.querySelector('.rst').addEventListener('click', () => { exp.reset(); t.fresh = true; setRunning(t, false); show(t); });
  cv.addEventListener('pointerdown', e => {
    if (!t.running){ setRunning(t, true); return; }
    if (exp.tap){ const b = cv.getBoundingClientRect(); exp.tap((e.clientX - b.left) / b.width * W, (e.clientY - b.top) / b.height * H); paint(t); show(t); }
    else setRunning(t, false);
  });
  exp.reset(); paint(t); show(t);
  return t;
});

const io = new IntersectionObserver(es => es.forEach(e => { const t = tiles.find(t => t.el === e.target); if (t) t.visible = e.isIntersecting; }), { rootMargin: '80px' });
tiles.forEach(t => io.observe(t.el));

let last = performance.now();
function frame(now){
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  for (const t of tiles){ if (!t.visible || !t.running) continue; t.exp.step(dt); paint(t); show(t); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__pi = { tiles, paint, show, setRunning };
})();
</script>
</body>
